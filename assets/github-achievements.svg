<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="GitHub achievements showcase">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ec4899"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="a3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22c55e"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <linearGradient id="a4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  </defs>
  <rect width="1000" height="300" rx="24" fill="url(#bg)"/>
  <text x="36" y="44" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="800">GitHub Achievements</text>
  <text x="36" y="70" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="14">Official achievements currently visible on the profile</text>

  <g transform="translate(28,92)">
    <rect width="226" height="172" rx="20" fill="#0f172a" stroke="#334155"/>
    <circle cx="113" cy="53" r="34" fill="url(#a1)"/>
    <text x="113" y="64" text-anchor="middle" fill="#fff" font-family="Segoe UI Emoji,Segoe UI,Arial" font-size="31">⚡</text>
    <text x="113" y="111" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial" font-size="21" font-weight="800">Quickdraw</text>
    <text x="113" y="138" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="13">Fast issue / PR action</text>
  </g>

  <g transform="translate(266,92)">
    <rect width="226" height="172" rx="20" fill="#0f172a" stroke="#334155"/>
    <circle cx="113" cy="53" r="34" fill="url(#a2)"/>
    <text x="113" y="61" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial" font-size="22" font-weight="900">YOLO</text>
    <text x="113" y="111" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial" font-size="21" font-weight="800">YOLO</text>
    <text x="113" y="138" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="13">Merged without review</text>
  </g>

  <g transform="translate(504,92)">
    <rect width="226" height="172" rx="20" fill="#0f172a" stroke="#334155"/>
    <circle cx="113" cy="53" r="34" fill="url(#a3)"/>
    <text x="113" y="63" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial" font-size="24" font-weight="900">PAIR</text>
    <text x="113" y="111" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial" font-size="18" font-weight="800">Pair Extraordinaire</text>
    <text x="113" y="138" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="13">Co-authored contribution</text>
  </g>

  <g transform="translate(742,92)">
    <rect width="230" height="172" rx="20" fill="#0f172a" stroke="#334155"/>
    <circle cx="115" cy="53" r="34" fill="url(#a4)"/>
    <text x="115" y="62" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial" font-size="24" font-weight="900">PR ×2</text>
    <text x="115" y="111" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial" font-size="21" font-weight="800">Pull Shark</text>
    <text x="115" y="138" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="13">Merged pull requests</text>
  </g>
</svg>